<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅行手帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{--bg:#FFFCF6;--ink:#3E3A39;--pk:#F2A497;--ye:#F6D27A;--bl:#A8D3E6;--gr:#B9DAA5;--c0:#FBE3DE;--c1:#FCF0CF;--c2:#DDEEF5;--c3:#E3F0D9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.wrap{max-width:1100px;margin:auto;padding:12px 12px 60px}
h1,h2,h3{margin:.2em 0;line-height:1.3}
.btn{display:inline-block;border:3px solid var(--ink);background:var(--ye);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);font-weight:700;text-decoration:none;color:var(--ink);margin:2px}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.s{min-height:36px;padding:2px 12px;font-size:14px}
.btn.p{background:var(--pk)}.btn.b{background:var(--bl)}.btn.g{background:var(--gr)}.btn.w{background:#fff}
.card{border:3px solid var(--ink);border-radius:26px;padding:16px;box-shadow:5px 5px 0 var(--ink);animation:in .4s both;position:relative;min-width:0}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.tape{position:absolute;top:-12px;left:24px;width:70px;height:22px;background:var(--ye);border:2px solid var(--ink);transform:rotate(-4deg);opacity:.9}
.b-{border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px;display:inline-block;margin:2px;background:#fff}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--ink);padding:8px 12px}
.nav .in{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.tabs .btn{flex:none;box-shadow:2px 2px 0 var(--ink)}
.tabs .btn[aria-current=page]{background:var(--pk);text-decoration:underline}
.days{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 10px;-webkit-overflow-scrolling:touch}
.days .btn{flex:none;text-align:center;line-height:1.3;border-radius:20px}
.days .btn[aria-current=true]{background:var(--pk);animation:pop .3s}
.tl{border-left:4px dashed var(--ink);margin:8px 0 0 8px;padding-left:14px;display:grid;gap:14px}
.tm{font-weight:700;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hero{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.hero{grid-template-columns:1fr 1fr;align-items:center}}
.ill svg{width:100%;height:auto;display:block}
.fl{animation:fl 4s ease-in-out infinite}.cl{animation:dr 12s ease-in-out infinite alternate}
.modal{border:3px solid var(--ink);border-radius:26px;background:var(--bg);padding:16px;width:min(560px,94vw);max-height:90vh;box-shadow:6px 6px 0 var(--ink);animation:pop .25s}
.modal::backdrop{background:rgba(62,58,57,.45)}
label{display:block;font-weight:700;margin-top:10px;font-size:14px}
input,select,textarea{width:100%;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff;min-height:44px}
input[type=checkbox]{width:24px;min-height:24px;display:inline-block;vertical-align:middle}
.err{color:#A02C1E;font-weight:700;min-height:1.2em}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ye);border:3px solid var(--ink);border-radius:999px;padding:6px 18px;z-index:99;box-shadow:3px 3px 0 var(--ink);display:none}
#toast.e{background:var(--pk)}
.empty{text-align:center;padding:24px}
.note{font-size:14px}
.bar{height:18px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes dr{to{transform:translateX(24px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script>

const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);

const textLink=(arr,dir)=>G+(dir?'dir/?api=1&destination=':'search/?api=1&query=')+encodeURIComponent(arr.filter(Boolean).join(' '));
const sortI=a=>a.slice().sort((x,y)=>(x.start||'99').localeCompare(y.start||'99'));
function curDay(t){t.days.sort((a,b)=>a.date.localeCompare(b.date));return t.days.find(d=>d.id===S.day)||t.days.find(d=>d.date===fd(today()))||t.days[0]}
function routeDay(){const t=T(),d=curDay(t);if(!d)return;const v=sortI(t.items.filter(i=>i.dayId===d.id&&valid(i)));if(!v.length)return toast('今天沒有有效的地點',1);

const m=modal(h('div',{},h('h2',{},'今日路線（'+S.mode+'）'),h('p',{class:'note'},'不同城市、過長的路線會自動分成多段，請依序開啟。'),links.map(l=>h('p',{},h('a',{class:'btn s b',href:l[1],target:'_blank',rel:'noopener'},l[0]))),h('button',{class:'btn w',type:'button',onclick:()=>m.close()},'關閉')))}
/* ===== modal / forms ===== */
function modal(c){const d=h('dialog',{class:'modal'},c);d.addEventListener('close',()=>d.remove());document.body.append(d);d.showModal();return d}
function confirmBox(msg,fn){const d=modal(h('div',{},h('h2',{},'請確認'),h('p',{},msg),h('button',{class:'btn p',type:'button',onclick:()=>{d.close();fn()}},'確定'),h('button',{class:'btn w',type:'button',onclick:()=>d.close()},'取消')))}
const fx=(k,l,t,o,r)=>({k,l,t:t||'text',o,r});
function form(title,fields,obj,cb,withNext){const id=uid(),er=h('div',{class:'err',role:'alert'});let d;
const f=h('form',{},h('h2',{},title),fields.map((x,i)=>{const fid=id+i;let inp;
if(x.t==='select')inp=h('select',{id:fid,name:x.k},x.o.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return h('option',{value:v,selected:(obj[x.k]??'')===v},l)}));

h('button',{class:'btn p',type:'submit',value:'ok'},'儲存'),withNext?h('button',{class:'btn g',type:'submit',value:'next'},'儲存並新增下一個'):null,h('button',{class:'btn w',type:'button',onclick:()=>d.close()},'取消'));
f.addEventListener('submit',e=>{e.preventDefault();const v={};fields.forEach(x=>{const el=f.elements[x.k];v[x.k]=x.t==='check'?el.checked:el.value.trim()});const err=cb(v,e.submitter&&e.submitter.value);if(err){er.textContent=err;return}d.close()});
d=modal(f);return d}
/* ===== form schemas ===== */
const cityOpts=t=>[['','（未指定）']].concat(t.cities.map(c=>[c.id,c.name])),cityNames=t=>[''].concat(t.cities.map(c=>c.name));
const F={
cities:{n:'城市',f:t=>[fx('name','城市名稱','text',0,1),fx('country','所屬國家／地區'),fx('from','停留開始','date'),fx('to','停留結束','date')],v:v=>v.from&&v.to&&v.to<v.from?'結束日期不能早於開始日期':'',lab:o=>o.name},
flights:{n:'航班',f:()=>[fx('dir','去程／回程','select',['去程','回程']),fx('airline','航空公司'),fx('no','航班編號'),fx('date','出發日期','date'),fx('dtime','起飛時間','time'),fx('dap','出發機場'),fx('atime','抵達時間','time'),fx('aap','抵達機場'),fx('note','備註','textarea')],lab:o=>o.airline+' '+o.no},
transports:{n:'城市間交通',f:t=>[fx('mode','交通方式','select',TM),fx('from','出發城市','select',cityNames(t)),fx('to','抵達城市','select',cityNames(t)),fx('date','出發日期','date'),fx('dtime','出發時間','time'),fx('atime','抵達時間','time'),fx('op','交通業者'),fx('no','班次編號'),fx('dst','出發機場／車站'),fx('ast','抵達機場／車站'),fx('note','備註','textarea')],lab:o=>o.mode+' '+o.from+'→'+o.to},
days:{n:'日期',f:()=>[fx('date','日期','date','',1),fx('title','當日標題')],v:(v,t,o)=>t.days.some(d=>d.date===v.date&&d!==o)?'這一天已經存在':'',lab:o=>o.date+'（會一併刪除當日所有行程）'},
items:{n:'行程',f:t=>[fx('name','行程名稱','text',0,1),fx('start','開始時間','time'),fx('end','結束時間','time'),fx('cityId','城市','select',cityOpts(t)),fx('place','地點名稱'),fx('addr','地址'),fx('cat','分類','select',CATS),fx('tr','交通方式','select',TRS),fx('must','必去景點','check'),fx('desc','描述','textarea'),fx('note','備註','textarea'),fx('url','Google Maps 網址（選填）','url'),fx('pid','Google Place ID（選填）'),fx('lat','緯度（選填）','number'),fx('lng','經度（選填）','number')],def:()=>({cat:'景點',tr:'步行'}),v:v=>v.start&&v.end&&v.end<v.start?'結束時間不能早於開始時間':(v.url&&!/^https?:\/\//i.test(v.url)?'網址需以 http(s):// 開頭':''),mk:(n)=>{n.dayId=S.day},lab:o=>o.name},

stays:{n:'住宿',f:()=>[fx('name','住宿名稱','text',0,1),fx('country','國家'),fx('city','城市'),fx('addr','地址'),fx('in','入住日期','date'),fx('out','退房日期','date'),fx('conf','訂房確認編號'),fx('tel','電話','tel'),fx('note','備註','textarea')],v:v=>v.in&&v.out&&v.out<v.in?'退房日期不能早於入住日期':'',lab:o=>o.name}};
function openForm(k,id,pre){const t=T(),c=F[k],o=id?t[k].find(x=>x.id===id):null;if(k==='items'&&!o)c.mk=n=>{n.dayId=curDay(t).id};
form((o?'編輯':'新增')+c.n,c.f(t),o||Object.assign({},c.def?c.def(t):{},pre),(v,m)=>{const e=c.v&&c.v(v,t,o);if(e)return e;if(o)Object.assign(o,v);else{const n=Object.assign({id:uid()},v);if(c.mk)c.mk(n);t[k].push(n);if(k==='days')S.day=n.id}persist();if(m==='next')setTimeout(()=>openForm(k,null,{cityId:v.cityId,start:v.end||v.start}),60)},k==='items'&&!o)}
function persist(){save();render()}
